blank_issues_enabled: true
contact_links:
  - name: Security vulnerability (please do not open a public issue)
    url: https://github.com/onyourmark/chat-threads/security/advisories/new
    about: >-
      Report privately through GitHub's security advisories, as described in
      SECURITY.md. Use this for anything that could expose a vulnerability or
      somebody's conversation data.
  - name: Can I send a pull request?
    url: https://github.com/onyourmark/chat-threads/blob/main/CONTRIBUTING.md
    about: >-
      Chat Threads is public source but is not currently accepting pull
      requests or other external code contributions. Bug reports, retrieval
      failures and security reports are very welcome.
