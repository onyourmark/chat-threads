name: Bug report
description: Something in Chat Threads behaved wrongly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        **Please do not paste conversation content.** Chat Threads is for
        private conversations, and a screenshot of the side panel is a
        screenshot of yours. Describe the shape of the problem instead — we can
        almost always work from that.


        If the problem is that a conversation would not load, the
        **Retrieval failure** template asks for the details that help most.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a ChatGPT conversation
        2. Click the Chat Threads icon
        3. Go to Split and press Review on a topic
        4. ...
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which site
      options:
        - ChatGPT
        - Claude
        - Both
        - Not specific to a site
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 151, or Edge 151 — see chrome://version"
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: Anything Chat Threads told you
      description: >-
        The exact text of any warning or error box, including the diagnostics
        list if one was shown. This names the part of the code to look at.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: >-
            I have not included conversation content, and any screenshot I
            attach shows no private text.
          required: true
        - label: >-
            This is not a security vulnerability. (If it is, report it
            privately instead — see SECURITY.md.)
          required: true
